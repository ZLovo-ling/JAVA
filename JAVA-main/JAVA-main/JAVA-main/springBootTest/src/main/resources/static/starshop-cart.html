<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物车 · 星河商城</title>
<link rel="stylesheet" href="starshop-theme.css">
</head>
<body>
<div class="sky"></div><div class="galaxy"></div>
<div class="nebula"></div><div class="nebula b"></div>
<canvas id="starfield"></canvas><div class="moon"></div>

<div id="topnav"></div>

<div class="app">
  <main class="container">
    <div class="section-title"><h2>我的购物车</h2><span class="tag" id="cartTag"></span></div>
    <div class="cat-layout" style="grid-template-columns:1fr 320px">
      <section><div class="cart-list" id="cartList"></div></section>
      <aside>
        <div class="glass-card summary">
          <div class="row"><span>已选商品</span><span id="sumCount">0 件</span></div>
          <div class="row"><span>合计</span><span class="total" id="sumTotal">¥0.00</span></div>
          <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="checkout()">去结算</button>
        </div>
      </aside>
    </div>
  </main>
  <footer class="footer">星河商城 · 让每一颗星都值得拥有 ✦</footer>
</div>

<!-- 结算地址弹窗 -->
<div class="modal-mask" id="addrMask">
  <div class="modal">
    <h3>填写收货信息</h3>
    <div class="field"><label>收货人</label><input id="addrName" placeholder="如：张三"></div>
    <div class="field"><label>手机号</label><input id="addrPhone" placeholder="11 位手机号"></div>
    <div class="field"><label>收货地址</label><input id="addrDetail" placeholder="省/市/区 详细地址"></div>
    <div class="actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeAddr()">取消</button>
      <button class="btn btn-primary" style="flex:1" onclick="submitOrder()">提交订单</button>
    </div>
  </div>
</div>

<script src="starshop-common.js"></script>
<script>
let CART = [];               // 购物车项（含 product 快照）
const checked = new Set();    // 选中项 id

function priceOf(c) { return c.product ? c.product.price : 0; }

function render() {
  const list = document.getElementById('cartList');
  if (!CART.length) {
    list.innerHTML = '<div class="empty"><div class="em">🛒</div>购物车还是空的，去 <a href="starshop-home.html" style="color:var(--cyan)">首页逛逛</a> 吧</div>';
    document.getElementById('cartTag').textContent = '';
    recalc();
    return;
  }
  document.getElementById('cartTag').textContent = '共 ' + CART.length + ' 种商品';
  list.innerHTML = CART.map(c => {
    const p = c.product || {};
    const isOn = checked.has(c.id);
    return `
    <div class="cart-item">
      <input type="checkbox" ${isOn ? 'checked' : ''} onchange="toggleCheck(${c.id}, this.checked)" style="width:18px;height:18px;accent-color:#818cf8">
      <div class="ci-icon">${p.icon || '🛍️'}</div>
      <div class="ci-main">
        <div class="ci-name">${p.name || '(商品已下架)'}</div>
        <div class="ci-cat">${p.categoryName || ''}</div>
        <div class="ci-price">¥${p.price != null ? p.price.toFixed(2) : '—'}</div>
      </div>
      <div class="ci-right">
        <div class="stepper">
          <button onclick="stepQty(${c.id}, -1)">−</button>
          <input value="${c.quantity}" readonly>
          <button onclick="stepQty(${c.id}, 1)">+</button>
        </div>
        <button class="btn btn-danger btn-sm" onclick="removeItem(${c.id})">删除</button>
      </div>
    </div>`;
  }).join('');
  recalc();
}

function recalc() {
  let count = 0, total = 0;
  CART.forEach(c => { if (checked.has(c.id)) { count += c.quantity; total += priceOf(c) * c.quantity; } });
  document.getElementById('sumCount').textContent = count + ' 件';
  document.getElementById('sumTotal').textContent = '¥' + total.toFixed(2);
}

function toggleCheck(id, on) { if (on) checked.add(id); else checked.delete(id); recalc(); }

async function stepQty(id, d) {
  const c = CART.find(x => x.id === id); if (!c) return;
  const nu = Math.max(1, c.quantity + d);
  try { await putJson('/api/cart', { id, quantity: nu }); c.quantity = nu; render(); updateCartBadge(); }
  catch (e) { toast(e.message, 'error'); }
}
async function removeItem(id) {
  try { await deleteJson('/api/cart/' + id); CART = CART.filter(x => x.id !== id); checked.delete(id); render(); updateCartBadge(); toast('已删除'); }
  catch (e) { toast(e.message, 'error'); }
}

function openAddr() {
  const ids = [...checked];
  if (!ids.length) { toast('请先选择商品', 'error'); return; }
  document.getElementById('addrMask').classList.add('show');
}
function closeAddr() { document.getElementById('addrMask').classList.remove('show'); }

async function submitOrder() {
  const ids = [...checked];
  if (!ids.length) { toast('请先选择商品', 'error'); return; }
  const name = document.getElementById('addrName').value.trim();
  const phone = document.getElementById('addrPhone').value.trim();
  const detail = document.getElementById('addrDetail').value.trim();
  if (!name || !phone || !detail) { toast('请填写完整收货信息', 'error'); return; }
  const u = getCurrentUser();
  try {
    const order = await postJson('/api/orders', {
      userId: u.id, itemIds: ids,
      receiverName: name, receiverPhone: phone, receiverAddress: detail
    });
    closeAddr();
    toast('下单成功');
    location.href = 'starshop-orders.html';
  } catch (e) { toast(e.message, 'error'); }
}
function checkout() { openAddr(); }

(async function init() {
  initStarfield();
  const u = requireLogin(); if (!u) return;
  renderNav('cart');
  await loadCart();
})();

async function loadCart() {
  const u = getCurrentUser();
  try {
    CART = await getJson('/api/cart', { userId: u.id }) || [];
    CART.forEach(c => checked.add(c.id));
    render();
  } catch (e) { document.getElementById('cartList').innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
}
</script>
</body>
</html>
