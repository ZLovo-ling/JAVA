<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星购 · 后台管理系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cyan: #7dd3fc; --violet: #a78bfa; --pink: #f9a8d4; --gold: #fde68a;
    --bg: #070a1c; --panel: rgba(20, 24, 58, .55); --line: rgba(148,170,255,.16);
    --text: #e2e8f0; --muted: rgba(198,208,246,.7);
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text); background: var(--bg); overflow: hidden;
  }
  body::before {
    content:""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1000px 600px at 85% -10%, rgba(120,100,255,.22), transparent 60%),
      radial-gradient(800px 500px at 0% 110%, rgba(56,189,248,.16), transparent 60%),
      linear-gradient(180deg, #0b1029 0%, #12183c 50%, #0c0f2c 100%);
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: 58px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    background: rgba(10, 13, 36, .78); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 2px; }
  .topbar .brand .logo {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 17px;
    background: linear-gradient(135deg, #6ee7f9, #8b5cf6 55%, #ec4899); box-shadow: 0 6px 16px rgba(139,92,246,.4);
  }
  .topbar .brand .name {
    font-size: 17px; letter-spacing: 3px;
    background: linear-gradient(92deg, var(--cyan), var(--violet) 55%, var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .topbar .brand .tag { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-left: 4px; }
  .topbar .right { display: flex; align-items: center; gap: 16px; }
  .topbar .admin-info { font-size: 13px; color: var(--muted); letter-spacing: .5px; }
  .topbar .admin-info b { color: #fff; }
  .btn-logout {
    padding: 8px 16px; border-radius: 11px; cursor: pointer; font-size: 13px; letter-spacing: 1px; color: #ffd9ec;
    background: rgba(236, 72, 153, .14); border: 1px solid rgba(249,168,212,.4); transition: all .3s; font-family: inherit;
  }
  .btn-logout:hover { background: rgba(236,72,153,.28); color: #fff; box-shadow: 0 0 18px rgba(236,72,153,.35); }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    position: fixed; top: 58px; left: 0; bottom: 0; z-index: 20; width: 224px;
    padding: 18px 14px; background: rgba(10, 13, 36, .7); backdrop-filter: blur(8px);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px;
  }
  .menu-title { font-size: 11px; letter-spacing: 2px; color: rgba(167,139,250,.7); margin: 6px 10px 4px; }
  .menu-item {
    display: flex; align-items: center; gap: 11px; padding: 11px 14px; border-radius: 12px; cursor: pointer;
    font-size: 14px; letter-spacing: 1px; color: #c7d2fe; transition: all .25s; border: 1px solid transparent;
  }
  .menu-item .ic { font-size: 17px; }
  .menu-item:hover { background: rgba(139, 92, 246, .14); color: #fff; }
  .menu-item.active {
    background: linear-gradient(92deg, rgba(56,189,248,.18), rgba(139,92,246,.28));
    color: #fff; border-color: rgba(167,139,250,.45); box-shadow: inset 0 0 18px rgba(139,92,246,.18);
  }
  .sidebar .spacer { flex: 1; }
  .sidebar .foot { font-size: 11px; color: rgba(167,139,250,.5); letter-spacing: 1px; padding: 10px; text-align: center; }

  /* ---------- 主区 ---------- */
  .main { position: relative; z-index: 10; margin-left: 224px; margin-top: 58px; height: calc(100vh - 58px); overflow-y: auto; padding: 24px 26px 40px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
  .page-head h2 { font-size: 20px; letter-spacing: 2px; color: #fff; display: flex; align-items: center; gap: 10px; }
  .page-head h2 .dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--pink)); box-shadow: 0 0 12px var(--violet); }
  .page-head .desc { font-size: 12.5px; color: var(--muted); letter-spacing: .5px; margin-top: 4px; }

  .btn-primary {
    padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 13.5px; letter-spacing: 1px; color: #fff; border: none;
    background: linear-gradient(92deg, #38bdf8 0%, #8b5cf6 48%, #ec4899 100%); background-size: 180% 100%;
    box-shadow: 0 8px 22px rgba(139,92,246,.4); transition: all .3s; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { background-position: 100% 0; transform: translateY(-1px); box-shadow: 0 10px 28px rgba(139,92,246,.6); }

  .search-box { display: flex; align-items: center; gap: 8px; background: rgba(13,17,44,.5); border: 1px solid var(--line); border-radius: 11px; padding: 8px 12px; }
  .search-box input { background: none; border: none; outline: none; color: #f1f5ff; font-size: 13.5px; width: 200px; font-family: inherit; }
  .search-box .ic { color: #9aa4e8; font-size: 14px; }

  /* ---------- 卡片 / 表格 ---------- */
  .card-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    backdrop-filter: blur(10px); box-shadow: 0 18px 50px rgba(0,0,0,.4);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 12.5px; letter-spacing: 1px; color: #aeb8f0; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody td { font-size: 13.5px; padding: 12px 14px; border-bottom: 1px solid rgba(148,170,255,.08); color: #dbe3ff; vertical-align: middle; }
  tbody tr:hover { background: rgba(139,92,246,.08); }
  tbody tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 3px 11px; border-radius: 20px; font-size: 12px; letter-spacing: .5px; }
  .badge-on { color: #7ff0c0; background: rgba(45,212,191,.16); border: 1px solid rgba(45,212,191,.4); }
  .badge-off { color: #b8c0e0; background: rgba(120,130,180,.16); border: 1px solid rgba(120,130,180,.35); }
  .badge-carousel { color: #fde68a; background: rgba(253,230,138,.14); border: 1px solid rgba(253,230,138,.4); }
  .badge-notice { color: #93c5fd; background: rgba(59,130,246,.16); border: 1px solid rgba(59,130,246,.4); }

  .cell-emoji { font-size: 20px; }
  .cell-name { font-weight: 600; color: #fff; }
  .cell-sub { font-size: 11.5px; color: var(--muted); }
  .price { color: var(--gold); font-weight: 600; }

  .op { display: flex; gap: 8px; }
  .op button { padding: 6px 12px; border-radius: 9px; cursor: pointer; font-size: 12.5px; border: 1px solid var(--line); background: rgba(20,24,58,.6); color: #c7d2fe; transition: all .25s; font-family: inherit; }
  .op button:hover { color: #fff; border-color: var(--violet); background: rgba(139,92,246,.18); }
  .op button.danger:hover { color: #fff; border-color: #f87171; background: rgba(248,113,113,.2); }
  .op button.link:hover { color: #fff; border-color: #38bdf8; background: rgba(56,189,248,.16); }

  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; letter-spacing: 1px; }

  /* ---------- 概览 ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px);
    box-shadow: 0 14px 40px rgba(0,0,0,.35); position: relative; overflow: hidden;
  }
  .stat::after { content:""; position: absolute; right: -20px; top: -20px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, rgba(167,139,250,.35), transparent 70%); }
  .stat .ic { font-size: 22px; margin-bottom: 10px; }
  .stat .num { font-size: 30px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .stat .lbl { font-size: 12.5px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }
  .overview-note { font-size: 12.5px; color: var(--muted); line-height: 1.9; letter-spacing: .5px; }
  .overview-note b { color: var(--cyan); }

  /* ---------- 弹窗（新增/编辑） ---------- */
  .modal-mask { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(5,8,25,.62); backdrop-filter: blur(6px); }
  .modal-mask.show { display: flex; }
  .modal { width: 92%; max-width: 460px; max-height: 86vh; overflow-y: auto; padding: 26px 26px 22px; border-radius: 20px; background: linear-gradient(160deg, rgba(30,35,80,.95), rgba(18,21,52,.92)); border: 1px solid rgba(148,170,255,.28); box-shadow: 0 30px 80px rgba(0,0,0,.65); animation: cardIn .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { text-align: center; font-size: 18px; letter-spacing: 3px; margin-bottom: 18px; color: transparent; background: linear-gradient(92deg, var(--cyan), var(--violet) 50%, var(--pink)); -webkit-background-clip: text; background-clip: text; }
  .modal .field { margin-bottom: 14px; }
  .modal .field label { display: block; font-size: 12.5px; margin-bottom: 6px; color: #c7d2fe; letter-spacing: .5px; }
  .modal .field label .req { color: #f9a8d4; }
  .modal .field input, .modal .field select, .modal .field textarea {
    width: 100%; padding: 11px 13px; font-size: 14px; color: #f1f5ff; background: rgba(13,17,44,.55);
    border: 1px solid rgba(140,160,255,.22); border-radius: 11px; outline: none; transition: all .25s; font-family: inherit;
  }
  .modal .field textarea { resize: vertical; min-height: 64px; }
  .modal .field input:focus, .modal .field select:focus, .modal .field textarea:focus { border-color: rgba(167,139,250,.8); box-shadow: 0 0 0 3px rgba(139,92,246,.16); }
  .modal .field .err { color: #fca5a5; font-size: 11.5px; margin-top: 4px; display: none; }
  .modal-btns { display: flex; gap: 12px; margin-top: 18px; }
  .modal-btns .btn-primary { flex: 1; justify-content: center; letter-spacing: 4px; }
  .btn-ghost { flex: 1; padding: 11px; border-radius: 12px; cursor: pointer; font-size: 14px; letter-spacing: 4px; color: #b9c3f2; background: rgba(20,24,58,.55); border: 1px solid rgba(148,170,255,.3); transition: all .3s; font-family: inherit; }
  .btn-ghost:hover { color: var(--cyan); border-color: var(--cyan); }

  /* 提示 toast */
  .toast { position: fixed; left: 50%; top: 70px; transform: translate(-50%, -16px); z-index: 99; padding: 12px 26px; border-radius: 40px; font-size: 14px; letter-spacing: 2px; color: #fff; background: linear-gradient(90deg, #38bdf8, #8b5cf6, #ec4899); box-shadow: 0 12px 40px rgba(139,92,246,.5); opacity: 0; pointer-events: none; transition: all .45s cubic-bezier(.2,.8,.2,1); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) {
    .sidebar { transform: translateX(-100%); } .main { margin-left: 0; }
    .search-box input { width: 130px; }
  }
</style>
</head>
<body>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚙</span>
      <span class="name">星购 · 后台管理</span>
      <span class="tag">ADMIN</span>
    </div>
    <div class="right">
      <span class="admin-info">欢迎，<b id="adminName">管理员</b></span>
      <button class="btn-logout" id="logoutBtn">退出登录</button>
    </div>
  </header>

  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="menu-title">运营数据管理</div>
    <div class="menu-item active" data-key="overview"><span class="ic">📊</span><span>概览仪表盘</span></div>
    <div class="menu-item" data-key="products"><span class="ic">🛍️</span><span>商品管理</span></div>
    <div class="menu-item" data-key="seckill"><span class="ic">⚡</span><span>限时秒杀</span></div>
    <div class="menu-item" data-key="members"><span class="ic">👑</span><span>会员权益</span></div>
    <div class="menu-item" data-key="notices"><span class="ic">📢</span><span>公告 / 轮播</span></div>
    <div class="spacer"></div>
    <div class="foot">星购商城 · 数据管理 v1.0</div>
  </aside>

  <!-- 主区 -->
  <main class="main" id="main"></main>

  <!-- 新增/编辑弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h3 id="modalTitle">新增</h3>
      <form id="editForm"></form>
      <div class="modal-btns">
        <button type="button" class="btn-ghost" id="modalCancel">取 消</button>
        <button type="button" class="btn-primary" id="modalSave">保 存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ================= 登录守卫 ================= */
    const admin = JSON.parse(sessionStorage.getItem('starshop_admin') || 'null');
    if (!admin) location.replace('starshop-admin-login.html');
    document.getElementById('adminName').textContent = admin ? admin.name : '管理员';

    /* ================= 数据存储 ================= */
    const LS = {
      get(k) { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } },
      set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    /* ================= 物品种类（商品分类，前后台共享同一套，与登录页「物品种类」专区一致） ================= */
    const CATEGORIES = ['数码', '数码配件', '家居', '生活', '运动', '手工', '食物', '厨具', '美妆', '服饰', '图书', '文具', '母婴', '玩具', '鲜花绿植', '宠物'];

    /* ================= 模块配置（首页展示功能的后台数据管理） ================= */
    const MODULES = {
      products: {
        label: '商品管理', icon: '🛍️', storage: 'starshop_admin_products',
        desc: '管理首页「精选好物」展示的商品：名称、分类、价格、销量与上下架状态。',
        filter: { key: 'category', label: '分类' },
        cols: [
          { key: 'emoji', label: '图标', fmt: it => `<span class="cell-emoji">${it.emoji || '📦'}</span>` },
          { key: 'name', label: '商品名称', fmt: it => `<span class="cell-name">${esc(it.name)}</span><div class="cell-sub">${esc(it.category || '')}</div>` },
          { key: 'price', label: '价格', fmt: it => `<span class="price">¥${fmtNum(it.price)}</span>` },
          { key: 'sales', label: '销量', fmt: it => (it.sales || 0) + ' 件' },
          { key: 'status', label: '状态', fmt: it => it.status === 'on'
              ? '<span class="badge badge-on">上架中</span>' : '<span class="badge badge-off">已下架</span>' },
          { key: 'op', label: '操作', fmt: it => opBtns(it, true) }
        ],
        fields: [
          { key: 'emoji', label: '商品图标', type: 'text', placeholder: '如 🎧', required: true },
          { key: 'name', label: '商品名称', type: 'text', placeholder: '请输入商品名称', required: true },
          { key: 'category', label: '分类', type: 'select', options: CATEGORIES.map(c => ({ v: c, t: c })), required: true },
          { key: 'price', label: '价格(元)', type: 'number', required: true },
          { key: 'sales', label: '销量(件)', type: 'number', default: 0 },
          { key: 'status', label: '状态', type: 'select', options: [{ v: 'on', t: '上架' }, { v: 'off', t: '下架' }] }
        ],
        seed: [
          { id: uid(), emoji: '🎧', name: '星空蓝牙耳机', category: '数码', price: 299, sales: 1280, status: 'on' },
          { id: uid(), emoji: '🥤', name: '星云保温杯', category: '生活', price: 89, sales: 560, status: 'on' },
          { id: uid(), emoji: '💡', name: '银河香薰灯', category: '家居', price: 159, sales: 342, status: 'off' },
          { id: uid(), emoji: '👟', name: '流星运动鞋', category: '运动', price: 499, sales: 870, status: 'on' },
          { id: uid(), emoji: '🧶', name: '手作星河挂毯', category: '手工', price: 199, sales: 210, status: 'on' },
          { id: uid(), emoji: '🍱', name: '星空便当盒', category: '食物', price: 69, sales: 430, status: 'on' },
          { id: uid(), emoji: '💄', name: '流光星辰口红', category: '美妆', price: 129, sales: 690, status: 'on' },
          { id: uid(), emoji: '👗', name: '银河渐变连衣裙', category: '服饰', price: 359, sales: 320, status: 'on' },
          { id: uid(), emoji: '📚', name: '星海漫游读物', category: '图书', price: 49, sales: 150, status: 'off' },
          { id: uid(), emoji: '🍼', name: '星际母婴礼盒', category: '母婴', price: 259, sales: 180, status: 'on' },
          { id: uid(), emoji: '🐾', name: '银河宠物窝', category: '宠物', price: 119, sales: 240, status: 'on' },
          { id: uid(), emoji: '🍳', name: '星尘不粘锅', category: '厨具', price: 179, sales: 310, status: 'on' },
          { id: uid(), emoji: '✏️', name: '流星手账套装', category: '文具', price: 39, sales: 520, status: 'on' },
          { id: uid(), emoji: '🧸', name: '星河毛绒公仔', category: '玩具', price: 99, sales: 660, status: 'on' },
          { id: uid(), emoji: '🌸', name: '星语永生花礼盒', category: '鲜花绿植', price: 129, sales: 280, status: 'on' }
        ]
      },

      seckill: {
        label: '限时秒杀', icon: '⚡', storage: 'starshop_admin_seckill',
        desc: '管理首页「限时秒杀」活动的场次：秒杀商品、原价/秒杀价、库存与起止时间。',
        cols: [
          { key: 'title', label: '活动标题', fmt: it => `<span class="cell-name">${esc(it.title)}</span><div class="cell-sub">${esc(it.productName || '')}</div>` },
          { key: 'price', label: '原价 / 秒杀价', fmt: it => `<span class="cell-sub">¥${fmtNum(it.originalPrice)}</span> → <span class="price">¥${fmtNum(it.seckillPrice)}</span>` },
          { key: 'stock', label: '剩余库存', fmt: it => (it.stock || 0) + ' 件' },
          { key: 'time', label: '活动时间', fmt: it => `<span class="cell-sub">${esc(it.startTime || '')} ~ ${esc(it.endTime || '')}</span>` },
          { key: 'status', label: '状态', fmt: it => it.status === 'on'
              ? '<span class="badge badge-on">进行中</span>' : '<span class="badge badge-off">已结束</span>' },
          { key: 'op', label: '操作', fmt: it => opBtns(it, true) }
        ],
        fields: [
          { key: 'title', label: '活动标题', type: 'text', placeholder: '如 星空耳机限时秒杀', required: true },
          { key: 'productName', label: '秒杀商品', type: 'text', placeholder: '关联商品名称', required: true },
          { key: 'originalPrice', label: '原价(元)', type: 'number', required: true },
          { key: 'seckillPrice', label: '秒杀价(元)', type: 'number', required: true },
          { key: 'stock', label: '库存(件)', type: 'number', default: 0 },
          { key: 'startTime', label: '开始时间', type: 'text', placeholder: '2026-10-30 10:00' },
          { key: 'endTime', label: '结束时间', type: 'text', placeholder: '2026-10-30 22:00' },
          { key: 'status', label: '状态', type: 'select', options: [{ v: 'on', t: '进行中' }, { v: 'off', t: '已结束' }] }
        ],
        seed: [
          { id: uid(), title: '星空耳机限时秒杀', productName: '星空蓝牙耳机', originalPrice: 299, seckillPrice: 199, stock: 100, startTime: '2026-10-30 10:00', endTime: '2026-10-30 22:00', status: 'on' },
          { id: uid(), title: '银河香薰灯秒杀', productName: '银河香薰灯', originalPrice: 159, seckillPrice: 99, stock: 60, startTime: '2026-10-31 20:00', endTime: '2026-11-01 20:00', status: 'on' },
          { id: uid(), title: '流星运动鞋秒杀', productName: '流星运动鞋', originalPrice: 499, seckillPrice: 399, stock: 30, startTime: '2026-11-01 12:00', endTime: '2026-11-01 18:00', status: 'off' }
        ]
      },

      members: {
        label: '会员权益', icon: '👑', storage: 'starshop_admin_members',
        desc: '管理首页「会员权益」的等级体系：成长值门槛、专属折扣与积分倍率。',
        cols: [
          { key: 'emoji', label: '标识', fmt: it => `<span class="cell-emoji">${it.emoji || '👑'}</span>` },
          { key: 'level', label: '会员等级', fmt: it => `<span class="cell-name">${esc(it.level)}</span>` },
          { key: 'growth', label: '成长值门槛', fmt: it => (it.growth || 0) + ' 成长值' },
          { key: 'discount', label: '专属折扣', fmt: it => `<span class="price">${(it.discount * 10).toFixed(1)} 折</span>` },
          { key: 'pointsRate', label: '积分倍率', fmt: it => (it.pointsRate || 1) + ' 倍' },
          { key: 'benefits', label: '权益说明', fmt: it => `<span class="cell-sub">${esc(it.benefits || '')}</span>` },
          { key: 'op', label: '操作', fmt: it => opBtns(it, false) }
        ],
        fields: [
          { key: 'emoji', label: '等级标识', type: 'text', placeholder: '如 👑' },
          { key: 'level', label: '会员等级', type: 'text', placeholder: '如 金卡会员', required: true },
          { key: 'growth', label: '成长值门槛', type: 'number', default: 0 },
          { key: 'discount', label: '折扣(0.85=8.5折)', type: 'number', step: '0.01', default: 1 },
          { key: 'pointsRate', label: '积分倍率', type: 'number', step: '0.1', default: 1 },
          { key: 'benefits', label: '权益说明', type: 'textarea', placeholder: '描述该等级专享权益' }
        ],
        seed: [
          { id: uid(), emoji: '🛒', level: '普通会员', growth: 0, discount: 1, pointsRate: 1, benefits: '基础购物积分，参与日常活动' },
          { id: uid(), emoji: '🥈', level: '银卡会员', growth: 1000, discount: 0.95, pointsRate: 1.2, benefits: '专属折扣 + 生日礼遇' },
          { id: uid(), emoji: '🥇', level: '金卡会员', growth: 5000, discount: 0.9, pointsRate: 1.5, benefits: '优先客服 + 全年免运费' },
          { id: uid(), emoji: '💎', level: '钻石会员', growth: 20000, discount: 0.85, pointsRate: 2, benefits: '专属顾问 + 年度专属好礼' }
        ]
      },

      notices: {
        label: '公告 / 轮播', icon: '📢', storage: 'starshop_admin_notices',
        desc: '管理首页顶部轮播图与公告标语：类型、标题、内容与展示排序。',
        cols: [
          { key: 'emoji', label: '图标', fmt: it => `<span class="cell-emoji">${it.emoji || '📢'}</span>` },
          { key: 'type', label: '类型', fmt: it => it.type === '轮播'
              ? '<span class="badge badge-carousel">轮播</span>' : '<span class="badge badge-notice">公告</span>' },
          { key: 'title', label: '标题', fmt: it => `<span class="cell-name">${esc(it.title)}</span>` },
          { key: 'content', label: '内容', fmt: it => `<span class="cell-sub">${esc(it.content || '')}</span>` },
          { key: 'sort', label: '排序', fmt: it => 'No.' + (it.sort || 0) },
          { key: 'status', label: '状态', fmt: it => it.status === 'on'
              ? '<span class="badge badge-on">展示中</span>' : '<span class="badge badge-off">已隐藏</span>' },
          { key: 'op', label: '操作', fmt: it => opBtns(it, true) }
        ],
        fields: [
          { key: 'emoji', label: '图标', type: 'text', placeholder: '如 🎆' },
          { key: 'type', label: '类型', type: 'select', options: [{ v: '轮播', t: '轮播' }, { v: '公告', t: '公告' }] },
          { key: 'title', label: '标题', type: 'text', placeholder: '请输入标题', required: true },
          { key: 'content', label: '内容', type: 'textarea', placeholder: '请输入展示内容' },
          { key: 'sort', label: '排序(数字越小越靠前)', type: 'number', default: 0 },
          { key: 'status', label: '状态', type: 'select', options: [{ v: 'on', t: '展示中' }, { v: 'off', t: '已隐藏' }] }
        ],
        seed: [
          { id: uid(), emoji: '🎆', type: '轮播', title: '星空购物节盛大开幕', content: '全场满减，星际好物低至 5 折', sort: 1, status: 'on' },
          { id: uid(), emoji: '🚚', type: '公告', title: '极速配送网络升级', content: '已覆盖全国主要城市，次日达', sort: 2, status: 'on' },
          { id: uid(), emoji: '👑', type: '公告', title: '会员成长体系全新上线', content: '消费即攒成长值，解锁专属权益', sort: 3, status: 'off' }
        ]
      }
    };

    /* ================= 工具函数 ================= */
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtNum(n) { const v = Number(n) || 0; return v.toLocaleString('zh-CN'); }
    function opBtns(it, hasStatus) {
      const toggle = hasStatus
        ? `<button data-act="toggle" data-id="${it.id}">${it.status === 'on' ? '隐藏' : '展示'}</button>` : '';
      return `<div class="op">
        <button class="link" data-act="edit" data-id="${it.id}">编辑</button>
        ${toggle}
        <button class="danger" data-act="del" data-id="${it.id}">删除</button>
      </div>`;
    }

    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(msg) {
      toast.textContent = '✦ ' + msg; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    /* ================= 首次进入写入种子数据 ================= */
    Object.values(MODULES).forEach(m => { if (!localStorage.getItem(m.storage)) LS.set(m.storage, m.seed); });

    /* ================= 渲染主区 ================= */
    const main = document.getElementById('main');
    let currentKey = 'overview';
    let searchQ = '';
    let filterVal = '';

    function renderOverview() {
      const p = LS.get('starshop_admin_products');
      const s = LS.get('starshop_admin_seckill');
      const m = LS.get('starshop_admin_members');
      const n = LS.get('starshop_admin_notices');
      const onProducts = p.filter(x => x.status === 'on').length;
      const onSeckill = s.filter(x => x.status === 'on').length;
      const onNotices = n.filter(x => x.status === 'on').length;

      main.innerHTML = `
        <div class="page-head">
          <div><h2><span class="dot"></span>概览仪表盘</h2>
          <div class="desc">首页展示内容的数据总览，数据实时来自下方各管理模块。</div></div>
        </div>
        <div class="stat-grid">
          <div class="stat"><div class="ic">🛍️</div><div class="num">${p.length}</div><div class="lbl">商品总数（上架 ${onProducts}）</div></div>
          <div class="stat"><div class="ic">⚡</div><div class="num">${s.length}</div><div class="lbl">秒杀活动（进行中 ${onSeckill}）</div></div>
          <div class="stat"><div class="ic">👑</div><div class="num">${m.length}</div><div class="lbl">会员等级</div></div>
          <div class="stat"><div class="ic">📢</div><div class="num">${n.length}</div><div class="lbl">公告/轮播（展示 ${onNotices}）</div></div>
        </div>
        <div class="card-box">
          <div class="overview-note">
            <b>本系统管理首页展示的四大功能模块：</b><br/>
            ① <b>精选好物</b>：商城首页商品列表与上下架控制；<br/>
            ② <b>限时秒杀</b>：首页秒杀专场的场次、价格与库存；<br/>
            ③ <b>会员权益</b>：首页会员成长体系与折扣倍率；<br/>
            ④ <b>公告 / 轮播</b>：首页顶部轮播图与公告标语。<br/><br/>
            点击左侧菜单进入对应模块，可<b>新增 / 编辑 / 删除 / 上下架</b>。所有数据保存在浏览器本地（localStorage），刷新不丢失。
          </div>
        </div>`;
    }

    function renderModule(key) {
      const m = MODULES[key];
      let data = LS.get(m.storage);
      if (m.filter && filterVal && filterVal !== '__all__') {
        data = data.filter(d => String(d[m.filter.key]) === filterVal);
      }
      if (searchQ) {
        const q = searchQ.toLowerCase();
        data = data.filter(d => Object.values(d).some(v => String(v).toLowerCase().includes(q)));
      }

      const head = m.cols.map(c => `<th>${c.label}</th>`).join('');
      const body = data.length
        ? data.map(it => `<tr>${m.cols.map(c => `<td>${c.fmt(it)}</td>`).join('')}</tr>`).join('')
        : `<tr><td colspan="${m.cols.length}"><div class="empty">暂无数据，点击右上角「新增」开始录入</div></td></tr>`;

      const filterHtml = m.filter
        ? `<div class="filter-box"><span>分类</span><select id="filterSelect">${(['__all__', ...CATEGORIES]).map(c => `<option value="${c}" ${filterVal === c ? 'selected' : ''}>${c === '__all__' ? '全部' : c}</option>`).join('')}</select></div>`
        : '';

      main.innerHTML = `
        <div class="page-head">
          <div><h2><span class="dot"></span>${m.label}</h2><div class="desc">${m.desc}</div></div>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
            ${filterHtml}
            <div class="search-box"><span class="ic">🔍</span><input id="searchInput" placeholder="搜索 ${m.label}…" value="${esc(searchQ)}" /></div>
            <button class="btn-primary" id="addBtn">＋ 新增</button>
          </div>
        </div>
        <div class="card-box"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;

      const filterSelect = document.getElementById('filterSelect');
      if (filterSelect) filterSelect.addEventListener('change', e => { filterVal = e.target.value; renderModule(key); });
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', e => { searchQ = e.target.value; renderModule(key); });
      document.getElementById('addBtn').addEventListener('click', () => openForm(key, null));

      main.querySelectorAll('.op button').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const act = btn.dataset.act;
          if (act === 'edit') openForm(key, id);
          else if (act === 'del') delItem(key, id);
          else if (act === 'toggle') toggleItem(key, id);
        });
      });
    }

    function showKey(key) {
      currentKey = key;
      document.querySelectorAll('.menu-item').forEach(el => el.classList.toggle('active', el.dataset.key === key));
      searchQ = '';
      if (key === 'overview') renderOverview();
      else renderModule(key);
    }

    /* ================= 增删改 ================= */
    function openForm(key, id) {
      const m = MODULES[key];
      const data = LS.get(m.storage);
      const item = id ? data.find(d => d.id === id) : null;
      const form = document.getElementById('editForm');
      form.innerHTML = m.fields.map(f => {
        const val = item ? (item[f.key] ?? '') : (f.default ?? '');
        let ctrl;
        if (f.type === 'select') {
          ctrl = `<select name="${f.key}">${f.options.map(o => `<option value="${o.v}" ${String(val) === o.v ? 'selected' : ''}>${o.t}</option>`).join('')}</select>`;
        } else if (f.type === 'textarea') {
          ctrl = `<textarea name="${f.key}" placeholder="${f.placeholder || ''}">${esc(val)}</textarea>`;
        } else {
          const step = f.step ? ` step="${f.step}"` : '';
          ctrl = `<input name="${f.key}" type="${f.type}" value="${esc(val)}" placeholder="${f.placeholder || ''}"${step} />`;
        }
        return `<div class="field"><label>${f.label}${f.required ? ' <span class="req">*</span>' : ''}</label>${ctrl}<div class="err">该项为必填</div></div>`;
      }).join('');
      document.getElementById('modalTitle').textContent = item ? `编辑${m.label.replace('管理', '')}` : `新增${m.label.replace('管理', '')}`;
      document.getElementById('modalMask').classList.add('show');
      form._key = key; form._id = id;
    }

    document.getElementById('modalCancel').addEventListener('click', closeForm);
    document.getElementById('modalMask').addEventListener('click', e => { if (e.target.id === 'modalMask') closeForm(); });
    function closeForm() { document.getElementById('modalMask').classList.remove('show'); }

    document.getElementById('modalSave').addEventListener('click', () => {
      const form = document.getElementById('editForm');
      const key = form._key, id = form._id;
      const m = MODULES[key];
      const data = LS.get(m.storage);
      const obj = { id: id || uid() };
      let ok = true;
      m.fields.forEach(f => {
        let v = form.elements[f.key].value.trim();
        if (f.type === 'number') v = v === '' ? (f.default ?? 0) : Number(v);
        if (f.required && (v === '' || v === null || (f.type === 'number' && isNaN(v)))) {
          ok = false;
          const err = form.elements[f.key].closest('.field').querySelector('.err');
          if (err) err.style.display = 'block';
        }
        obj[f.key] = v;
      });
      if (!ok) { showToast('请填写必填项'); return; }

      if (id) {
        const idx = data.findIndex(d => d.id === id);
        if (idx > -1) data[idx] = obj;
      } else {
        data.unshift(obj);
      }
      LS.set(m.storage, data);
      closeForm();
      showToast(id ? '已保存修改' : '新增成功');
      if (currentKey === key) renderModule(key);
      else renderOverview();
    });

    function delItem(key, id) {
      if (!confirm('确定要删除这条数据吗？此操作不可恢复。')) return;
      const m = MODULES[key];
      let data = LS.get(m.storage);
      data = data.filter(d => d.id !== id);
      LS.set(m.storage, data);
      showToast('已删除');
      if (currentKey === key) renderModule(key); else renderOverview();
    }

    function toggleItem(key, id) {
      const m = MODULES[key];
      let data = LS.get(m.storage);
      const it = data.find(d => d.id === id);
      if (it) { it.status = it.status === 'on' ? 'off' : 'on'; LS.set(m.storage, data); showToast(it.status === 'on' ? '已展示' : '已隐藏'); }
      if (currentKey === key) renderModule(key); else renderOverview();
    }

    /* ================= 菜单 / 退出 ================= */
    document.querySelectorAll('.menu-item').forEach(el => el.addEventListener('click', () => showKey(el.dataset.key)));
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('starshop_admin');
      location.replace('starshop-admin-login.html');
    });

    /* ================= 初始化 ================= */
    showKey('overview');
  </script>
</body>
</html>
