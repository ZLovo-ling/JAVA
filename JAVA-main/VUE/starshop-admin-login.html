<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星购 · 后台管理系统 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cyan: #7dd3fc;
    --violet: #a78bfa;
    --pink: #f9a8d4;
    --gold: #fde68a;
    --deep: #070a1c;
  }

  html { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e2e8f0;
    overflow: hidden;
    background: #070a1c;
    min-height: 100%;
  }

  /* ---------- 夜空背景（与商城首页同源风格） ---------- */
  .sky {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(120, 100, 255, .28), transparent 60%),
      radial-gradient(900px 600px at 10% 105%, rgba(56, 189, 248, .18), transparent 60%),
      radial-gradient(700px 500px at 50% 50%, rgba(232, 121, 249, .10), transparent 65%),
      linear-gradient(180deg, #0b1029 0%, #151b43 42%, #241b50 68%, #0c0f2c 100%);
  }
  .galaxy {
    position: fixed; z-index: 0; top: 50%; left: 50%;
    width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
    pointer-events: none; opacity: .38;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(124, 92, 255, .16) 40deg, rgba(56, 189, 248, .10) 90deg,
      transparent 150deg, rgba(236, 72, 153, .10) 230deg, rgba(167, 139, 250, .14) 300deg, transparent 360deg);
    animation: galaxySpin 120s linear infinite;
  }
  @keyframes galaxySpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #starfield { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }
  .moon {
    position: fixed; z-index: 1; top: 9%; right: 11%;
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fdf8e8, #f6e7b2 45%, #e9cf8f 100%);
    box-shadow: 0 0 60px 20px rgba(253, 230, 138, .32), 0 0 120px 45px rgba(253, 230, 138, .12),
      inset -18px -14px 40px rgba(190, 160, 95, .45);
    animation: moonGlow 6s ease-in-out infinite alternate, moonDrift 40s ease-in-out infinite alternate;
  }
  @keyframes moonGlow {
    from { box-shadow: 0 0 50px 16px rgba(253,230,138,.28), 0 0 110px 40px rgba(253,230,138,.1), inset -18px -14px 40px rgba(190,160,95,.45); }
    to   { box-shadow: 0 0 70px 26px rgba(253,230,138,.42), 0 0 140px 55px rgba(253,230,138,.18), inset -18px -14px 40px rgba(190,160,95,.45); }
  }
  @keyframes moonDrift { from { transform: translateY(0); } to { transform: translateY(16px); } }

  /* ---------- 布局 ---------- */
  .stage {
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }

  /* 玻璃拟态卡片 */
  .card {
    width: 100%; max-width: 420px; padding: 40px 38px 32px;
    border-radius: 26px; position: relative;
    background: linear-gradient(160deg, rgba(30, 35, 80, .55), rgba(18, 21, 52, .45));
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(148, 170, 255, .22);
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15), 0 0 60px rgba(120,100,255,.10);
    animation: cardIn .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(26px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .card::before {
    content: ""; position: absolute; top: -1px; left: 12%; width: 76%; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), var(--pink), transparent); opacity: .9;
  }

  .brand { text-align: center; margin-bottom: 6px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo-ic {
    width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px;
    background: linear-gradient(135deg, #6ee7f9, #8b5cf6 55%, #ec4899);
    box-shadow: 0 8px 24px rgba(139, 92, 246, .45); font-size: 24px; animation: spinSlow 12s linear infinite;
  }
  @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .brand-text {
    font-size: 28px; letter-spacing: 5px; font-weight: 700;
    background: linear-gradient(92deg, var(--cyan) 0%, var(--violet) 45%, var(--pink) 80%, var(--gold) 110%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(167, 139, 250, .55)); font-family: "STKaiti", "KaiTi", serif;
  }
  .brand-sub { margin-top: 8px; font-size: 12px; letter-spacing: 3px; color: rgba(201, 182, 255, .7); }
  .stars-divider { text-align: center; margin: 4px 0 20px; font-size: 12px; letter-spacing: 12px; color: rgba(201,182,255,.6); text-shadow: 0 0 12px rgba(167,139,250,.8); }

  /* ---------- 表单 ---------- */
  .field { margin-bottom: 18px; position: relative; }
  .field label { display: block; font-size: 13px; margin-bottom: 7px; letter-spacing: 1px; color: transparent; background: linear-gradient(90deg, #c4b5fd, #e9d5ff); -webkit-background-clip: text; background-clip: text; }
  .input-box { position: relative; display: flex; align-items: center; }
  .input-ic { position: absolute; left: 14px; font-size: 16px; color: #9aa4e8; }
  .input-box input {
    width: 100%; padding: 13px 14px 13px 44px; font-size: 15px; color: #f1f5ff; letter-spacing: 1px;
    background: rgba(13, 17, 44, .5); border: 1px solid rgba(140, 160, 255, .22); border-radius: 13px;
    outline: none; transition: all .3s; font-family: inherit;
  }
  .input-box input::placeholder { color: rgba(178, 190, 230, .45); }
  .input-box input:focus {
    border-color: rgba(167, 139, 250, .8); box-shadow: 0 0 0 4px rgba(139, 92, 246, .18), 0 0 22px rgba(139, 92, 246, .3); background: rgba(16, 20, 50, .65);
  }
  .toggle-psw { position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: #9aa4e8; font-size: 16px; }
  .toggle-psw:hover { color: var(--cyan); }

  .btn-login {
    width: 100%; padding: 14px; border: none; border-radius: 14px; cursor: pointer; font-size: 16px; font-weight: 600;
    letter-spacing: 8px; color: #fffdf5; background: linear-gradient(92deg, #38bdf8 0%, #8b5cf6 48%, #ec4899 100%);
    background-size: 180% 100%; box-shadow: 0 10px 30px rgba(139, 92, 246, .4); transition: all .3s; font-family: inherit;
  }
  .btn-login:hover { background-position: 100% 0; box-shadow: 0 12px 36px rgba(139, 92, 246, .6), 0 0 30px rgba(236, 72, 153, .35); transform: translateY(-2px); }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .btn-login .twinkle { display: inline-block; color: var(--gold); text-shadow: 0 0 8px var(--gold); }

  .hint {
    margin-top: 18px; padding: 10px 14px; border-radius: 12px; font-size: 12px; line-height: 1.7;
    letter-spacing: .5px; color: #cbd5ff; background: rgba(90, 80, 200, .14); border: 1px dashed rgba(148,170,255,.28);
  }
  .hint b { color: var(--gold); }

  .back-shop {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; width: 100%; justify-content: center;
    font-size: 13px; letter-spacing: 1px; color: #b9c3f2; text-decoration: none; cursor: pointer; transition: all .3s;
  }
  .back-shop:hover { color: var(--cyan); }

  /* 提示 toast */
  .toast {
    position: fixed; left: 50%; top: 8%; transform: translate(-50%, -16px); z-index: 99;
    padding: 12px 26px; border-radius: 40px; font-size: 14px; letter-spacing: 2px; color: #fff;
    background: linear-gradient(90deg, #38bdf8, #8b5cf6, #ec4899); box-shadow: 0 12px 40px rgba(139,92,246,.5);
    opacity: 0; pointer-events: none; transition: all .45s cubic-bezier(.2,.8,.2,1); display: flex; align-items: center; gap: 8px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .card { padding: 32px 24px 26px; }
    .moon { width: 72px; height: 72px; top: 5%; right: 7%; }
  }
</style>
</head>
<body>

  <div class="sky"></div>
  <div class="galaxy"></div>
  <canvas id="starfield"></canvas>
  <div class="moon"></div>

  <div class="stage">
    <div class="card">
      <div class="brand">
        <div class="logo"><div class="logo-ic">⚙</div></div>
        <div class="brand-text">星购 · 后台</div>
        <div class="brand-sub">STARSHOP ADMIN · 运营管理平台</div>
      </div>
      <div class="stars-divider">✦ ✧ ✦</div>

      <form id="adminLoginForm">
        <div class="field">
          <label>✦ 管理员账号</label>
          <div class="input-box">
            <span class="input-ic">👤</span>
            <input type="text" id="adminAcc" placeholder="请输入管理员账号" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label>✦ 密码</label>
          <div class="input-box">
            <span class="input-ic">🔒</span>
            <input type="password" id="adminPsw" placeholder="请输入密码" autocomplete="current-password" />
            <button type="button" class="toggle-psw" id="togglePsw" title="显示/隐藏密码">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="adminLoginBtn"><span class="twinkle">✦</span> 登 录 <span class="twinkle">✦</span></button>
      </form>

      <div class="hint">
        🔐 默认管理员账号：<b>admin</b> ／ 密码：<b>admin888</b>（权限 0，可登录后台）<br />
        ⚠️ 普通用户（权限 1，如 demo／123456）无管理员权限，无法登录后台。<br />
        （用户表已自动写入本地，明文存储，仅用于演示）
      </div>

      <a class="back-shop" href="starshop-login.html">← 返回星购商城首页</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ================= 星空粒子系统 ================= */
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let W, H, DPR, stars = [], bright = [], shooting = null;
    const COLORS = ['#ffffff', '#cfe6ff', '#fff3c4', '#e5d9ff', '#bff3ff', '#ffd9ec'];
    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = innerWidth * DPR; H = canvas.height = innerHeight * DPR;
      canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px'; buildStars();
    }
    function buildStars() {
      const count = Math.floor((innerWidth * innerHeight) / 2600); stars = [];
      for (let i = 0; i < count; i++) {
        const lv = Math.random(); let layer, r, drift;
        if (lv < .62) { layer = 0; r = Math.random() * .5 + .25; drift = Math.random() * .06 + .02; }
        else if (lv < .92) { layer = 1; r = Math.random() * .6 + .7; drift = Math.random() * .12 + .07; }
        else { layer = 2; r = Math.random() * .8 + 1.3; drift = Math.random() * .2 + .16; }
        stars.push({ x: Math.random() * W, y: Math.random() * H, r: r * DPR, layer, drift: drift * DPR,
          alpha: layer === 0 ? .45 : layer === 1 ? .7 : .95, tw: Math.random() * Math.PI * 2,
          speed: Math.random() * .9 + .3, color: COLORS[(Math.random() * COLORS.length) | 0] });
      }
      bright = stars.filter(s => s.layer === 2).slice(0, 26);
    }
    function spawnShooting() {
      shooting = { x: W * (0.1 + Math.random() * 0.75), y: H * (0.03 + Math.random() * 0.28),
        vx: (3.2 + Math.random() * 2.4) * DPR, vy: (1.9 + Math.random() * 1.8) * DPR, life: 1 };
    }
    let t = 0;
    function draw() {
      t += .016; ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(167, 139, 250, .16)'; ctx.lineWidth = .8 * DPR;
      for (let i = 0; i < bright.length; i++) {
        const a = bright[i];
        for (let j = i + 1; j < bright.length; j++) {
          const b = bright[j]; const dx = a.x - b.x, dy = a.y - b.y; const d2 = dx * dx + dy * dy;
          if (d2 < 42000 * DPR * DPR) { const d = Math.sqrt(d2); ctx.globalAlpha = (1 - d / (205 * DPR)) * .3;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        }
      }
      for (const s of stars) {
        s.x -= s.drift; if (s.x < -8) { s.x = W + 8; s.y = Math.random() * H; }
        const a = (Math.sin(t * s.speed + s.tw) + 1) / 2;
        ctx.globalAlpha = s.alpha * (.35 + a * .65); ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r + a * .7, 0, Math.PI * 2); ctx.fill();
        if (s.layer >= 1 && a > .55) { ctx.globalAlpha = a * .22; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (1.6 + a * 1.8), 0, Math.PI * 2); ctx.fill(); }
      }
      if (!shooting && Math.random() < .006) spawnShooting();
      if (shooting) {
        shooting.x += shooting.vx; shooting.y += shooting.vy; shooting.life -= .014;
        if (shooting.life <= 0 || shooting.x > W + 400 || shooting.y > H + 400) shooting = null;
        else {
          const hx = shooting.x, hy = shooting.y, tx = hx - shooting.vx * 5, ty = hy - shooting.vy * 5;
          ctx.globalAlpha = .95; ctx.lineWidth = 2.2 * DPR; ctx.lineCap = 'round';
          const g = ctx.createLinearGradient(hx, hy, tx, ty);
          g.addColorStop(0, 'rgba(255,250,232,.95)'); g.addColorStop(.35, 'rgba(253,230,138,.6)'); g.addColorStop(1, 'rgba(253,230,138,0)');
          ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
          ctx.globalAlpha = .9; ctx.fillStyle = '#fffae8'; ctx.beginPath(); ctx.arc(hx, hy, 2.4 * DPR, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = .35; ctx.beginPath(); ctx.arc(hx, hy, 7 * DPR, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1; requestAnimationFrame(draw);
    }
    resize(); window.addEventListener('resize', resize); requestAnimationFrame(draw);

    /* ================= 表单交互与登录 ================= */
    const psw = document.getElementById('adminPsw');
    const togglePsw = document.getElementById('togglePsw');
    togglePsw.addEventListener('click', () => {
      psw.type = psw.type === 'password' ? 'text' : 'password';
      togglePsw.textContent = psw.type === 'password' ? '👁' : '🙈';
    });

    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(msg) {
      toast.innerHTML = '✦ ' + msg; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    /* 已登录则直接进入后台 */
    if (sessionStorage.getItem('starshop_admin')) location.replace('starshop-admin.html');

    /* ================= 用户表：与商城首页共用 starhop_users ================= */
    /* 明文密码，permission: 0 = 管理员权限；1 = 默认(普通用户)权限。注册用户为 1。 */
    const USERS_KEY = 'starshop_users';
    function getUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); } catch (e) { return []; }
    }
    if (!localStorage.getItem(USERS_KEY)) {
      localStorage.setItem(USERS_KEY, JSON.stringify([
        { username: '超级管理员', account: 'admin', password: 'admin888', permission: 0 },
        { username: '星购体验官', account: 'demo',  password: '123456',  permission: 1 }
      ]));
    }

    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const acc = document.getElementById('adminAcc').value.trim();
      const pwd = psw.value;
      if (!acc) { showToast('请先输入管理员账号'); return; }
      if (!pwd) { showToast('请先输入密码'); return; }

      const user = getUsers().find(u => u.account === acc && u.password === pwd);
      if (!user) { showToast('账号或密码错误'); return; }
      // 权限校验：只有 permission=0 的管理员权限才能登录后台
      if (user.permission !== 0) { showToast('您没有管理员权限，无法登录后台'); return; }

      sessionStorage.setItem('starshop_admin', JSON.stringify({ account: user.account, name: user.username, role: 'admin' }));
      showToast('验证通过，正在进入后台...');
      setTimeout(() => { location.href = 'starshop-admin.html'; }, 800);
    });
  </script>
</body>
</html>
