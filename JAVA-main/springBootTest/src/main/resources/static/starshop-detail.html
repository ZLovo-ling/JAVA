<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品详情 · 星河商城</title>
<link rel="stylesheet" href="starshop-theme.css">
</head>
<body>
<div class="sky"></div><div class="galaxy"></div>
<div class="nebula"></div><div class="nebula b"></div>
<canvas id="starfield"></canvas><div class="moon"></div>

<div id="topnav"></div>

<div class="app">
  <main class="container">
    <div class="breadcrumb" id="crumb"><a href="starshop-home.html">首页</a> / 商品详情</div>
    <div id="detailRoot">
      <div class="empty">加载中…</div>
    </div>
  </main>
  <footer class="footer">星河商城 · 让每一颗星都值得拥有 ✦</footer>
</div>

<script src="starshop-common.js"></script>
<script>
let PRODUCT = null;
let qty = 1;

function render(p) {
  const seckill = p.isSeckill;
  const priceNow = seckill && p.seckillPrice != null ? p.seckillPrice : p.price;
  const origin = seckill ? p.price : (p.originalPrice || null);
  const path = (p.categoryPath || []).filter(Boolean);
  document.getElementById('crumb').innerHTML =
    '<a href="starshop-home.html">首页</a> / ' +
    (path.length ? path.map(n => `<a href="starshop-category.html">${n}</a>`).join(' / ') + ' / ' : '') +
    `<span>${p.name}</span>`;

  document.getElementById('detailRoot').innerHTML = `
    <div class="detail-layout">
      <div class="detail-media"><div class="big-icon">${p.icon || '🛍️'}</div></div>
      <div class="detail-info">
        <h1>${p.name} ${seckill ? '<span class="badge-seckill">限时秒杀</span>' : ''}</h1>
        <div class="meta">分类：${p.categoryName || '—'}　|　销量：${p.sales || 0}${seckill ? '　|　秒杀库存：' + (p.seckillStock != null ? p.seckillStock : '—') : ''}</div>
        <div class="detail-price">
          <span class="now"><span class="cur" style="font-size:18px">¥</span>${priceNow}</span>
          ${origin ? `<span class="was">¥${origin}</span>` : ''}
        </div>
        <div class="detail-desc">${p.description || '暂无描述'}</div>
        <div class="qty">
          <span class="label">数量</span>
          <div class="stepper">
            <button onclick="changeQty(-1)">−</button>
            <input id="qtyInput" value="${qty}" readonly>
            <button onclick="changeQty(1)">+</button>
          </div>
          <span class="stock-tip">库存 ${seckill ? (p.seckillStock != null ? p.seckillStock : '—') : (p.stock != null ? p.stock : '—')}</span>
        </div>
        <div class="detail-actions">
          <button class="btn btn-primary" onclick="addCart()">加入购物车</button>
          <button class="btn btn-ghost" onclick="buyNow()">立即购买</button>
        </div>
      </div>
    </div>`;
}

function changeQty(d) {
  const max = PRODUCT && PRODUCT.seckillStock != null ? PRODUCT.seckillStock : (PRODUCT && PRODUCT.stock != null ? PRODUCT.stock : 99);
  qty = Math.max(1, Math.min(max, qty + d));
  const inp = document.getElementById('qtyInput');
  if (inp) inp.value = qty;
}

async function addCart() {
  const u = requireLogin(); if (!u) return;
  try {
    await postJson('/api/cart/add', { userId: u.id, productId: PRODUCT.id, quantity: qty });
    toast('已加入购物车');
    updateCartBadge();
  } catch (e) { toast(e.message, 'error'); }
}

async function buyNow() {
  const u = requireLogin(); if (!u) return;
  try {
    await postJson('/api/cart/add', { userId: u.id, productId: PRODUCT.id, quantity: qty });
    location.href = 'starshop-cart.html';
  } catch (e) { toast(e.message, 'error'); }
}

(async function init() {
  initStarfield();
  renderNav('home');
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('detailRoot').innerHTML = '<div class="empty">缺少商品ID</div>'; return; }
  try {
    PRODUCT = await getJson('/api/goods/' + id);
    render(PRODUCT);
  } catch (e) { document.getElementById('detailRoot').innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
})();
</script>
</body>
</html>
