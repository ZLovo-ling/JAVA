<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星购 · 星空购物 - 首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cyan: #7dd3fc;
    --violet: #a78bfa;
    --pink: #f9a8d4;
    --gold: #fde68a;
    --deep: #070a1c;
  }

  html { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e2e8f0;
    overflow-x: hidden;
    background: #070a1c;
    min-height: 100%;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(10, 14, 38, .6); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #7dd3fc, #a78bfa, #f9a8d4);
    border-radius: 8px;
  }

  /* ---------- 夜空底层背景（与登录页完全一致） ---------- */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(120, 100, 255, .28), transparent 60%),
      radial-gradient(900px 600px at 10% 105%, rgba(56, 189, 248, .18), transparent 60%),
      radial-gradient(700px 500px at 50% 50%, rgba(232, 121, 249, .10), transparent 65%),
      linear-gradient(180deg, #0b1029 0%, #151b43 42%, #241b50 68%, #0c0f2c 100%);
  }
  .galaxy {
    position: fixed;
    z-index: 0;
    top: 50%; left: 50%;
    width: 220vmax; height: 220vmax;
    margin: -110vmax 0 0 -110vmax;
    pointer-events: none;
    opacity: .38;
    background: conic-gradient(from 0deg,
      transparent 0deg,
      rgba(124, 92, 255, .16) 40deg,
      rgba(56, 189, 248, .10) 90deg,
      transparent 150deg,
      rgba(236, 72, 153, .10) 230deg,
      rgba(167, 139, 250, .14) 300deg,
      transparent 360deg);
    animation: galaxySpin 120s linear infinite;
  }
  @keyframes galaxySpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .nebula {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(600px 400px at 18% 28%, rgba(99, 102, 241, .18), transparent 70%),
      radial-gradient(500px 380px at 78% 62%, rgba(14, 165, 233, .15), transparent 70%);
    animation: nebulaFloat 24s ease-in-out infinite alternate;
  }
  @keyframes nebulaFloat {
    from { transform: translate3d(-3%, -2%, 0) scale(1);    opacity: .85; }
    to   { transform: translate3d(4%, 3%, 0) scale(1.12);   opacity: 1; }
  }
  .nebula.b {
    animation: nebulaFloatB 32s ease-in-out infinite alternate;
    background:
      radial-gradient(520px 360px at 62% 18%, rgba(236, 72, 153, .13), transparent 70%),
      radial-gradient(460px 340px at 25% 78%, rgba(45, 212, 191, .10), transparent 70%);
  }
  @keyframes nebulaFloatB {
    from { transform: translate3d(4%, 3%, 0) scale(1.1);  opacity: .8; }
    to   { transform: translate3d(-4%, -4%, 0) scale(1);  opacity: 1; }
  }
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .moon {
    position: fixed;
    z-index: 1;
    top: 12%;
    right: 7%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fdf8e8, #f6e7b2 45%, #e9cf8f 100%);
    box-shadow:
      0 0 60px 20px rgba(253, 230, 138, .35),
      0 0 120px 45px rgba(253, 230, 138, .15),
      inset -18px -14px 40px rgba(190, 160, 95, .45);
    animation: moonDrift 40s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes moonDrift { from { transform: translateY(0); } to { transform: translateY(16px); } }
  .moon-crater {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgba(196, 166, 100, .35), rgba(196,166,100,.12) 70%, transparent);
  }

  /* ---------- 顶部导航栏 ---------- */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 0 32px;
    height: 64px;
    background: linear-gradient(180deg, rgba(14, 17, 44, .85), rgba(14, 17, 44, .62));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(148, 170, 255, .18);
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }
  .nav-logo-ic {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: linear-gradient(135deg, #6ee7f9, #8b5cf6 55%, #ec4899);
    box-shadow: 0 6px 18px rgba(139, 92, 246, .45);
    font-size: 17px;
    animation: spinSlow 12s linear infinite;
  }
  @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .nav-logo-text {
    font-size: 19px;
    letter-spacing: 4px;
    font-weight: 700;
    background: linear-gradient(92deg, var(--cyan) 0%, var(--violet) 45%, var(--pink) 80%, var(--gold) 110%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(167, 139, 250, .5));
    font-family: "STKaiti", "KaiTi", serif;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
  }
  .nav-links a {
    position: relative;
    padding: 8px 16px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #b9c3f2;
    text-decoration: none;
    border-radius: 10px;
    transition: all .3s;
    cursor: pointer;
    white-space: nowrap;
  }
  .nav-links a:hover { color: var(--cyan); background: rgba(90, 80, 200, .18); }
  .nav-links a.active {
    color: transparent;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    font-weight: 600;
  }
  .nav-links a.active::after {
    content: "";
    position: absolute;
    left: 16px; right: 16px; bottom: 2px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
    box-shadow: 0 0 10px rgba(167, 139, 250, .7);
  }

  /* 导航右侧用户区 */
  .nav-user {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .nav-cart {
    position: relative;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 12px;
    border: 1px solid rgba(148, 170, 255, .3);
    background: rgba(20, 24, 58, .6);
    color: var(--cyan);
    font-size: 17px;
    cursor: pointer;
    transition: all .3s;
  }
  .nav-cart:hover { color: var(--pink); border-color: var(--pink); box-shadow: 0 0 16px rgba(249,168,212,.35); }
  .cart-badge {
    position: absolute;
    top: -6px; right: -6px;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    display: grid; place-items: center;
    font-size: 11px;
    font-weight: 700;
    color: #fffdf5;
    background: linear-gradient(92deg, #38bdf8, #ec4899);
    box-shadow: 0 0 10px rgba(236, 72, 153, .6);
    transform: scale(0);
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .cart-badge.show { transform: scale(1); }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 6px;
    border-radius: 30px;
    background: rgba(20, 24, 58, .6);
    border: 1px solid rgba(148, 170, 255, .25);
    font-size: 13px;
    letter-spacing: 1px;
    color: #dbe6ff;
  }
  .user-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 14px;
    background: linear-gradient(135deg, #6ee7f9, #8b5cf6 55%, #ec4899);
    box-shadow: 0 0 14px rgba(139, 92, 246, .5);
  }
  .btn-logout {
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid rgba(148, 170, 255, .3);
    background: transparent;
    color: #b9c3f2;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .3s;
    font-family: inherit;
  }
  .btn-logout:hover { color: var(--pink); border-color: var(--pink); box-shadow: 0 0 16px rgba(249, 168, 212, .35); }

  /* ---------- 主内容区 ---------- */
  .main {
    position: relative;
    z-index: 2;
    max-width: 1080px;
    margin: 0 auto;
    padding: 110px 24px 60px;
  }

  /* 搜索区 */
  .hero { text-align: center; margin-bottom: 36px; animation: heroIn .8s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes heroIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .hero-greet {
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 10px;
    color: transparent;
    background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
  }
  .hero-title {
    font-size: 34px;
    letter-spacing: 8px;
    font-weight: 700;
    background: linear-gradient(92deg, var(--cyan) 0%, var(--violet) 45%, var(--pink) 80%, var(--gold) 110%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 16px rgba(167, 139, 250, .55));
    font-family: "STKaiti", "KaiTi", serif;
  }
  .hero-sub {
    margin-top: 12px;
    font-size: 13px;
    letter-spacing: 3px;
    color: transparent;
    background: linear-gradient(90deg, #a5b4fc, #fbcfe8, #a5b4fc);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: sloganFlow 6s linear infinite;
  }
  @keyframes sloganFlow { from { background-position: 0% 0; } to { background-position: 200% 0; } }

  .search-box {
    margin: 32px auto 0;
    max-width: 620px;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 6px;
    border-radius: 40px;
    background: linear-gradient(160deg, rgba(30, 35, 80, .6), rgba(18, 21, 52, .5));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(148, 170, 255, .28);
    box-shadow: 0 16px 44px rgba(0, 0, 0, .4), 0 0 40px rgba(120, 100, 255, .12);
    transition: all .3s;
  }
  .search-box:focus-within {
    border-color: rgba(167, 139, 250, .8);
    box-shadow: 0 16px 44px rgba(0, 0, 0, .4), 0 0 40px rgba(139, 92, 246, .35);
  }
  .search-ic { padding: 0 8px 0 18px; font-size: 17px; color: #9aa4e8; }
  .search-box input {
    flex: 1;
    padding: 12px 6px;
    font-size: 15px;
    letter-spacing: 1px;
    color: #f1f5ff;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
  }
  .search-box input::placeholder { color: rgba(178, 190, 230, .45); }
  .btn-search {
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #fffdf5;
    background: linear-gradient(92deg, #38bdf8 0%, #8b5cf6 48%, #ec4899 100%);
    background-size: 180% 100%;
    box-shadow: 0 8px 22px rgba(139, 92, 246, .4);
    transition: all .3s;
    font-family: inherit;
  }
  .btn-search:hover {
    background-position: 100% 0;
    box-shadow: 0 10px 28px rgba(139, 92, 246, .6), 0 0 24px rgba(236, 72, 153, .35);
  }

  /* 分类快捷标签（两级：顶级 + 子级） */
  .cats {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    animation: heroIn .8s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .cats.sub { margin-top: 12px; }
  .cat-chip {
    padding: 7px 18px;
    border-radius: 20px;
    font-size: 12.5px;
    letter-spacing: 2px;
    color: #dbe6ff;
    background: rgba(90, 80, 200, .18);
    border: 1px solid rgba(148, 170, 255, .22);
    cursor: pointer;
    transition: all .3s;
    user-select: none;
  }
  .cat-chip:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 16px rgba(56, 189, 248, .3); }
  .cat-chip.active {
    color: #fffdf5;
    background: linear-gradient(92deg, rgba(56,189,248,.45), rgba(139,92,246,.45), rgba(236,72,153,.45));
    border-color: rgba(167, 139, 250, .7);
    box-shadow: 0 0 18px rgba(139, 92, 246, .35);
  }
  .cat-chip.sub {
    font-size: 12px;
    background: rgba(20, 24, 58, .45);
  }

  /* ---------- 限时秒杀条（纯前端展示） ---------- */
  .seckill {
    position: relative;
    margin: 34px 0 8px;
    padding: 18px 22px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    background: linear-gradient(120deg, rgba(236, 72, 153, .18), rgba(139, 92, 246, .14), rgba(56, 189, 248, .16));
    border: 1px solid rgba(249, 168, 212, .3);
    box-shadow: 0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden;
    animation: heroIn .8s .12s cubic-bezier(.2,.8,.2,1) both;
  }
  .seckill::before {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    transform: skewX(-20deg);
    animation: seckillSweep 4.5s ease-in-out infinite;
  }
  @keyframes seckillSweep { 0% { left: -40%; } 60%,100% { left: 120%; } }
  .seckill-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    color: transparent;
    background: linear-gradient(90deg, var(--gold), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 10px rgba(249,168,212,.5));
  }
  .seckill-count {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #fde68a;
  }
  .seckill-count b {
    display: inline-grid; place-items: center;
    min-width: 26px; height: 26px;
    padding: 0 4px;
    border-radius: 7px;
    background: rgba(8, 10, 28, .6);
    border: 1px solid rgba(253, 230, 138, .35);
    color: var(--gold);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .seckill-desc { flex: 1; min-width: 160px; font-size: 12.5px; letter-spacing: 1px; color: rgba(236, 222, 255, .75); }
  .seckill-go {
    padding: 9px 22px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #fffdf5;
    background: linear-gradient(92deg, #38bdf8, #8b5cf6, #ec4899);
    box-shadow: 0 8px 20px rgba(236, 72, 153, .4);
    transition: all .3s;
    font-family: inherit;
  }
  .seckill-go:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(236, 72, 153, .6); }

  /* 商品区 */
  .sec-title {
    margin: 44px 0 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 17px;
    letter-spacing: 4px;
    font-weight: 700;
    color: transparent;
    background: linear-gradient(92deg, var(--cyan), var(--violet) 50%, var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 10px rgba(167,139,250,.5));
    animation: heroIn .8s .2s cubic-bezier(.2,.8,.2,1) both;
  }
  .sec-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(148,170,255,.4), transparent);
  }
  .goods-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    animation: heroIn .8s .3s cubic-bezier(.2,.8,.2,1) both;
  }
  .goods-card {
    position: relative;
    padding: 22px 16px 18px;
    border-radius: 20px;
    text-align: center;
    background: rgba(14, 18, 46, .5);
    border: 1px solid rgba(148,170,255,.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all .35s;
    cursor: pointer;
  }
  .goods-card:hover {
    transform: translateY(-6px);
    border-color: rgba(167,139,250,.55);
    box-shadow: 0 14px 32px rgba(88, 60, 200, .35), 0 0 24px rgba(139,92,246,.25);
    background: rgba(22, 26, 62, .62);
  }
  .g-badge {
    position: absolute;
    top: 12px; left: 12px;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 10.5px;
    letter-spacing: 1px;
    color: #fffdf5;
    background: linear-gradient(92deg, #38bdf8, #8b5cf6);
    box-shadow: 0 0 12px rgba(139, 92, 246, .4);
  }
  .g-ic {
    font-size: 40px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 12px rgba(167,139,250,.55));
  }
  .g-name {
    font-size: 14px;
    letter-spacing: 1px;
    color: #e8edff;
    margin-bottom: 6px;
  }
  .g-cat {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(196, 206, 255, .55);
    margin-bottom: 10px;
  }
  .g-price {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #fda4af, var(--pink), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
  .g-price::first-letter { font-size: 13px; }
  .g-orig {
    font-size: 12px;
    font-weight: 400;
    color: rgba(178, 190, 230, .5);
    text-decoration: line-through;
    -webkit-text-fill-color: rgba(178, 190, 230, .5);
    margin-left: 6px;
    letter-spacing: 0;
  }
  .btn-cart {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid rgba(148,170,255,.3);
    background: rgba(90, 80, 200, .2);
    color: #dbe6ff;
    font-size: 12.5px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .3s;
    font-family: inherit;
  }
  .btn-cart:hover {
    color: #fffdf5;
    background: linear-gradient(92deg, #38bdf8, #8b5cf6, #ec4899);
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(139, 92, 246, .45);
  }
  .goods-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 0;
    font-size: 14px;
    letter-spacing: 2px;
    color: rgba(196, 206, 255, .55);
  }

  /* 页脚 */
  .footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px dashed rgba(148,170,255,.2);
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(190, 202, 244, .5);
  }

  /* 提示 toast */
  .toast {
    position: fixed;
    left: 50%; top: 84px;
    transform: translate(-50%, -16px);
    z-index: 99;
    padding: 12px 26px;
    border-radius: 40px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(90deg, #38bdf8, #8b5cf6, #ec4899);
    box-shadow: 0 12px 40px rgba(139,92,246,.5);
    opacity: 0;
    pointer-events: none;
    transition: all .45s cubic-bezier(.2,.8,.2,1);
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 返回顶部 */
  .back-top {
    position: fixed;
    right: 22px; bottom: 22px;
    z-index: 50;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(148,170,255,.3);
    background: rgba(20, 24, 58, .7);
    color: var(--cyan);
    font-size: 18px;
    cursor: pointer;
    display: grid; place-items: center;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
    backdrop-filter: blur(8px);
  }
  .back-top.show { opacity: 1; pointer-events: auto; }
  .back-top:hover { box-shadow: 0 0 22px rgba(56,189,248,.5); transform: translateY(-3px); }

  @media (max-width: 900px) {
    .goods-grid { grid-template-columns: repeat(2, 1fr); }
    .nav-links { display: none; }
    .hero-title { font-size: 26px; letter-spacing: 5px; }
  }
  @media (max-width: 520px) {
    .goods-grid { grid-template-columns: 1fr; }
    .nav { padding: 0 16px; gap: 12px; }
    .btn-search { padding: 12px 18px; letter-spacing: 2px; }
    .seckill { padding: 16px; }
    .nav-logo-text { display: none; }
  }
</style>
</head>
<body>

  <!-- 动态星空背景层 -->
  <div class="sky"></div>
  <div class="galaxy"></div>
  <div class="nebula"></div>
  <div class="nebula b"></div>
  <canvas id="starfield"></canvas>

  <!-- 月亮 -->
  <div class="moon">
    <div class="moon-crater" style="width:22px;height:22px;top:14px;left:16px;"></div>
    <div class="moon-crater" style="width:13px;height:13px;top:44px;left:46px;"></div>
    <div class="moon-crater" style="width:9px;height:9px;top:26px;left:55px;"></div>
  </div>

  <!-- 顶部导航栏 -->
  <nav class="nav">
    <div class="nav-logo" onclick="location.href='starshop-home.html'">
      <div class="nav-logo-ic">✦</div>
      <div class="nav-logo-text">星购商城</div>
    </div>
    <div class="nav-links">
      <a class="active" href="starshop-home.html">首页</a>
      <a href="starshop-category.html">商品分类</a>
      <a href="starshop-seckill.html">限时秒杀</a>
      <a href="starshop-cart.html">购物车</a>
      <a href="starshop-orders.html">我的订单</a>
    </div>
    <div class="nav-user">
      <div class="nav-cart" onclick="location.href='starshop-cart.html'" title="购物车">
        🛒
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
      <div class="user-chip">
        <div class="user-avatar">✦</div>
        <span id="username">星友</span>
      </div>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
  </nav>

  <!-- 主内容 -->
  <div class="main">

    <!-- 搜索区 -->
    <div class="hero">
      <div class="hero-greet" id="greet">✦ 欢迎回到星购商城 ✦</div>
      <div class="hero-title">穿越星海 · 购你所爱</div>
      <div class="hero-sub">STAR SHOPPING · 每一件好物都是一颗等待被发现的星星</div>
      <div class="search-box">
        <span class="search-ic">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索心仪好物，如：耳机 / 键盘 / 星空灯..." />
        <button class="btn-search" onclick="doSearch()">搜 索</button>
      </div>
      <!-- 两级分类：顶级一行，选中后下方出现子分类 -->
      <div class="cats" id="catsTop"></div>
      <div class="cats sub" id="catsSub"></div>
    </div>

    <!-- 限时秒杀条（纯前端展示，倒计时为本地模拟） -->
    <div class="seckill">
      <div class="seckill-tag">⚡ 限时秒杀</div>
      <div class="seckill-count">距结束
        <b id="ckH">02</b>:<b id="ckM">00</b>:<b id="ckS">00</b>
      </div>
      <div class="seckill-desc">每日星空专场 · 全场低至 1 折 · 优惠券可叠加</div>
      <button class="seckill-go" onclick="location.href='starshop-seckill.html'">立即抢购</button>
    </div>

    <!-- 商品列表 -->
    <div class="sec-title">✦ 为你推荐</div>
    <div class="goods-grid" id="goodsGrid"></div>

    <!-- 页脚 -->
    <div class="footer">星购商城 STAR SHOPPING · 正品保障 · 七天无理由退换 · 售后无忧</div>
  </div>

  <!-- 提示 toast -->
  <div class="toast" id="toast"></div>

  <!-- 返回顶部 -->
  <button class="back-top" id="backTop" title="回到星空之巅">✦</button>

  <script>
    /* ================= 后端接口基地址（与登录页保持一致） ================= */
    // 同源（Spring Boot 托管）用相对路径；直接双击打开(file://)回退到本地后端
    const API_BASE = location.protocol.startsWith('http') ? '' : 'http://localhost:8081';

    /* ================= 通用 GET 请求 ================= */
    async function getJson(url) {
      const resp = await fetch(API_BASE + url, { headers: { 'Accept': 'application/json' } });
      const data = await resp.json();
      if (data.code !== 200) throw new Error(data.message || '请求失败');
      return data.data;
    }

    /* ================= 登录态检查 ================= */
    const user = JSON.parse(sessionStorage.getItem('starshop_user') || 'null');
    if (!user) {
      // 未登录直接回到登录页
      location.replace('starshop-login.html');
    } else {
      document.getElementById('username').textContent = user.username || '星友';
      document.getElementById('greet').textContent = '✦ 欢迎回来，' + (user.username || '星友') + ' ✦';
      // 同步真实购物车数量
      const base = (location.protocol === 'file:') ? 'http://localhost:8081' : '';
      fetch(base + '/api/cart?userId=' + user.id, { credentials: 'include' })
        .then(r => r.json()).then(j => {
          if (j.code === 200 && j.data) {
            cartCount = j.data.reduce((s, c) => s + (c.quantity || 0), 0);
            if (cartCount > 0) { cartBadge.textContent = cartCount; cartBadge.classList.add('show'); }
          }
        }).catch(() => {});
    }

    function logout() {
      // 退出：清理前端登录态；接口接入后可改为 POST /api/auth/logout
      sessionStorage.removeItem('starshop_user');
      showToast('已退出登录，期待与你再次相遇');
      setTimeout(() => location.replace('starshop-login.html'), 900);
    }

    /* ================= 星空粒子系统（与登录页一致） ================= */
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let W, H, DPR;
    let stars = [];
    let bright = [];
    let shooting = null;
    const COLORS = ['#ffffff', '#cfe6ff', '#fff3c4', '#e5d9ff', '#bff3ff', '#ffd9ec'];

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = innerWidth * DPR;
      H = canvas.height = innerHeight * DPR;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      buildStars();
    }
    function buildStars() {
      const count = Math.floor((innerWidth * innerHeight) / 2400);
      stars = [];
      for (let i = 0; i < count; i++) {
        const lv = Math.random();
        let layer, r, drift;
        if (lv < .62)      { layer = 0; r = Math.random() * .5 + .25; drift = Math.random() * .06 + .02; }
        else if (lv < .92) { layer = 1; r = Math.random() * .6 + .7;  drift = Math.random() * .12 + .07; }
        else               { layer = 2; r = Math.random() * .8 + 1.3; drift = Math.random() * .2 + .16; }
        stars.push({
          x: Math.random() * W, y: Math.random() * H,
          r: r * DPR, layer, drift: drift * DPR,
          alpha: layer === 0 ? .45 : layer === 1 ? .7 : .95,
          tw: Math.random() * Math.PI * 2,
          speed: Math.random() * .9 + .3,
          color: COLORS[(Math.random() * COLORS.length) | 0]
        });
      }
      bright = stars.filter(s => s.layer === 2).slice(0, 26);
    }
    function spawnShooting() {
      shooting = { x: W * (0.1 + Math.random() * 0.75), y: H * (0.03 + Math.random() * 0.28),
        vx: (3.2 + Math.random() * 2.4) * DPR, vy: (1.9 + Math.random() * 1.8) * DPR, life: 1 };
    }
    let t = 0;
    function draw() {
      t += .016;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(167, 139, 250, .16)';
      ctx.lineWidth = .8 * DPR;
      for (let i = 0; i < bright.length; i++) {
        const a = bright[i];
        for (let j = i + 1; j < bright.length; j++) {
          const b = bright[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < 42000 * DPR * DPR) {
            const d = Math.sqrt(d2);
            ctx.globalAlpha = (1 - d / (205 * DPR)) * .3;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      for (const s of stars) {
        s.x -= s.drift;
        if (s.x < -8) { s.x = W + 8; s.y = Math.random() * H; }
        const a = (Math.sin(t * s.speed + s.tw) + 1) / 2;
        ctx.globalAlpha = s.alpha * (.35 + a * .65);
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r + a * .7, 0, Math.PI * 2); ctx.fill();
        if (s.layer >= 1 && a > .55) {
          ctx.globalAlpha = a * .22;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (1.6 + a * 1.8), 0, Math.PI * 2); ctx.fill();
        }
      }
      if (!shooting && Math.random() < .006) spawnShooting();
      if (shooting) {
        shooting.x += shooting.vx; shooting.y += shooting.vy; shooting.life -= .014;
        if (shooting.life <= 0 || shooting.x > W + 400 || shooting.y > H + 400) { shooting = null; }
        else {
          const hx = shooting.x, hy = shooting.y, tx = hx - shooting.vx * 5, ty = hy - shooting.vy * 5;
          ctx.globalAlpha = .95; ctx.lineWidth = 2.2 * DPR; ctx.lineCap = 'round';
          const g = ctx.createLinearGradient(hx, hy, tx, ty);
          g.addColorStop(0, 'rgba(255, 250, 232, .95)');
          g.addColorStop(.35, 'rgba(253, 230, 138, .6)');
          g.addColorStop(1, 'rgba(253, 230, 138, 0)');
          ctx.strokeStyle = g;
          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
          ctx.globalAlpha = .9; ctx.fillStyle = '#fffae8';
          ctx.beginPath(); ctx.arc(hx, hy, 2.4 * DPR, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = .35; ctx.beginPath(); ctx.arc(hx, hy, 7 * DPR, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(draw);

    /* ================= 提示 toast ================= */
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(msg) {
      toast.innerHTML = '✦ ' + msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
      ));
    }

    /* ================= 首页数据（来自后端接口） ================= */
    // GET /api/categories  -> 分级分类树
    // GET /api/goods?keyword=&categoryId=  -> 商品列表（分级检索）
    let allCats = [];        // 分类树
    let curTopId = null;     // 当前选中的顶级分类（null=全部）
    let curChildId = null;   // 当前选中的子分类（null=未选子分类）
    let cartCount = 0;
    const cartBadge = document.getElementById('cartBadge');
    const catsTop = document.getElementById('catsTop');
    const catsSub = document.getElementById('catsSub');
    const gridEl = document.getElementById('goodsGrid');
    const searchInput = document.getElementById('searchInput');

    function currentCategoryId() {
      return curChildId != null ? curChildId : curTopId;
    }

    /* 渲染分类标签（两级） */
    function renderCats() {
      catsTop.innerHTML = '';
      catsSub.innerHTML = '';
      // 全部
      const all = mkChip('全部', curTopId === null && curChildId === null, () => {
        curTopId = null; curChildId = null; renderCats(); loadGoods();
      });
      catsTop.appendChild(all);
      // 顶级分类
      allCats.forEach(top => {
        const chip = mkChip(top.name, curTopId === top.id, () => {
          curTopId = top.id; curChildId = null; renderCats(); loadGoods();
        });
        catsTop.appendChild(chip);
      });
      // 子分类（选中顶级且存在子级时展示）
      if (curTopId != null) {
        const top = allCats.find(c => c.id === curTopId);
        if (top && top.children && top.children.length) {
          top.children.forEach(child => {
            const chip = mkChip(child.name, curChildId === child.id, () => {
              curChildId = child.id; renderCats(); loadGoods();
            });
            chip.classList.add('sub');
            catsSub.appendChild(chip);
          });
        }
      }
    }
    function mkChip(text, active, onClick) {
      const el = document.createElement('span');
      el.className = 'cat-chip' + (active ? ' active' : '');
      el.textContent = text;
      el.onclick = onClick;
      return el;
    }

    /* 加载分类树 */
    function loadCategories() {
      getJson('/api/categories').then(list => {
        allCats = list || [];
        renderCats();
      }).catch(() => {
        showToast('分类加载失败，请确认后端已启动（端口 8081）');
      });
    }

    /* 加载商品（搜索 + 分级分类） */
    function loadGoods() {
      const params = new URLSearchParams();
      const kw = searchInput.value.trim();
      if (kw) params.set('keyword', kw);
      const cid = currentCategoryId();
      if (cid != null) params.set('categoryId', cid);
      const qs = params.toString();
      getJson('/api/goods' + (qs ? '?' + qs : '')).then(list => {
        renderGoods(list || []);
      }).catch(() => {
        showToast('商品加载失败，请确认后端已启动（端口 8081）');
      });
    }

    /* 渲染商品网格 */
    function renderGoods(list) {
      if (!list.length) {
        gridEl.innerHTML = '<div class="goods-empty">✦ 这片星域暂时没有找到相关好物，换个关键词试试 ✦</div>';
        return;
      }
      gridEl.innerHTML = '';
      list.forEach(g => {
        const card = document.createElement('div');
        card.className = 'goods-card';
        const orig = (g.originalPrice != null)
          ? '<span class="g-orig">¥' + Number(g.originalPrice).toFixed(2) + '</span>' : '';
        card.innerHTML =
          (g.isHot === 1 ? '<div class="g-badge">HOT</div>' : '') +
          '<div class="g-ic">' + (g.icon || '🛍️') + '</div>' +
          '<div class="g-name">' + esc(g.name) + '</div>' +
          '<div class="g-cat">' + esc(g.categoryName || '') + '</div>' +
          '<div class="g-price">¥' + Number(g.price).toFixed(2) + orig + '</div>' +
          '<button class="btn-cart">加入购物车</button>';
        card.querySelector('.btn-cart').onclick = (e) => {
          e.stopPropagation();
          const u = JSON.parse(sessionStorage.getItem('starshop_user') || 'null');
          if (!u || !u.id) { showToast('请先登录'); location.href = 'starshop-login.html'; return; }
          const base = (location.protocol === 'file:') ? 'http://localhost:8081' : '';
          fetch(base + '/api/cart/add', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'include', body: JSON.stringify({ userId: u.id, productId: g.id, quantity: 1 })
          }).then(r => r.json()).then(j => {
            if (j.code === 200) {
              cartCount++; cartBadge.textContent = cartCount; cartBadge.classList.add('show');
              showToast('已把「' + g.name + '」收入星囊');
            } else showToast('加入失败：' + j.message);
          }).catch(() => showToast('加入失败，请确认后端已启动（端口 8081）'));
        };
        card.onclick = () => { location.href = 'starshop-detail.html?id=' + g.id; };
        gridEl.appendChild(card);
      });
    }

    /* ================= 搜索 ================= */
    function doSearch() {
      curChildId = null; // 搜索时回到顶级维度，保留顶级分类筛选
      loadGoods();
      const kw = searchInput.value.trim();
      if (kw) showToast('已在星海中为你检索「' + kw + '」');
    }
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

    /* ================= 导航 / 购物车（其他页面待开发） ================= */
    function navTip(el, name) {
      if (name === '首页') return;
      // TODO(后端): 后续页面跳转，例如 location.href = 'starshop-category.html'
      showToast('「' + name + '」页面正在星云中建造，敬请期待');
    }
    function cartTip() {
      // TODO(后端): 后续跳转购物车页，或拉取 GET /api/cart
      if (cartCount === 0) showToast('星囊还空空如也，去挑点好物吧');
      else showToast('购物车功能正在建造中，当前已选 ' + cartCount + ' 件（演示）');
    }

    /* ================= 限时秒杀倒计时（纯前端模拟） ================= */
    let left = 2 * 3600;
    const ckH = document.getElementById('ckH');
    const ckM = document.getElementById('ckM');
    const ckS = document.getElementById('ckS');
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    function tickCountdown() {
      if (left <= 0) left = 2 * 3600;
      const h = Math.floor(left / 3600);
      const m = Math.floor((left % 3600) / 60);
      const s = left % 60;
      ckH.textContent = pad(h); ckM.textContent = pad(m); ckS.textContent = pad(s);
      left--;
    }
    tickCountdown();
    setInterval(tickCountdown, 1000);

    /* 返回顶部 */
    const backTop = document.getElementById('backTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 220) backTop.classList.add('show');
      else backTop.classList.remove('show');
    });
    backTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* 初始渲染：拉取分类树与推荐商品 */
    loadCategories();
    loadGoods();
  </script>
</body>
</html>
