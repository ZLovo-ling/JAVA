<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的订单 · 星河商城</title>
<link rel="stylesheet" href="starshop-theme.css">
</head>
<body>
<div class="sky"></div><div class="galaxy"></div>
<div class="nebula"></div><div class="nebula b"></div>
<canvas id="starfield"></canvas><div class="moon"></div>

<div id="topnav"></div>

<div class="app">
  <main class="container">
    <div class="section-title"><h2>我的订单</h2><span class="tag" id="ordTag"></span></div>
    <div id="orderList"></div>
  </main>
  <footer class="footer">星河商城 · 让每一颗星都值得拥有 ✦</footer>
</div>

<script src="starshop-common.js"></script>
<script>
const STATUS = { 1: '待付款', 2: '待发货', 3: '待收货', 4: '已完成', 5: '已取消' };

function render(orders) {
  const el = document.getElementById('orderList');
  if (!orders || !orders.length) {
    el.innerHTML = '<div class="empty"><div class="em">📦</div>还没有订单，去 <a href="starshop-home.html" style="color:var(--cyan)">首页</a> 下单吧</div>';
    document.getElementById('ordTag').textContent = '';
    return;
  }
  document.getElementById('ordTag').textContent = '共 ' + orders.length + ' 笔订单';
  el.innerHTML = orders.map(o => {
    const items = o.items || [];
    const totalQty = items.reduce((s, i) => s + i.quantity, 0);
    return `
    <div class="order-card">
      <div class="order-head">
        <span class="order-no">订单号 ${o.orderNo}</span>
        <span class="order-status st-${o.status}">${STATUS[o.status] || '未知'}</span>
      </div>
      <div class="order-items">
        ${items.map(i => `
          <div class="order-row">
            <span class="oi-icon">${i.icon || '🛍️'}</span>
            <span class="oi-name">${i.productName} <span class="oi-qty">×${i.quantity}</span></span>
            <span class="oi-price">¥${(i.price * i.quantity).toFixed(2)}</span>
          </div>`).join('')}
      </div>
      <div class="order-foot">
        <span class="order-addr">收货：${o.receiverName} ${o.receiverPhone} · ${o.receiverAddress}</span>
        <span class="total" style="color:#fb7185;font-weight:800">合计 ¥${o.totalAmount != null ? Number(o.totalAmount).toFixed(2) : '0.00'}（${totalQty} 件）</span>
      </div>
    </div>`;
  }).join('');
}

(async function init() {
  initStarfield();
  const u = requireLogin(); if (!u) return;
  renderNav('orders');
  try {
    const orders = await getJson('/api/orders', { userId: u.id }) || [];
    render(orders);
  } catch (e) { document.getElementById('orderList').innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
})();
</script>
</body>
</html>
